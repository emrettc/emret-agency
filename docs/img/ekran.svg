<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
  <title id="t">Emret Agency ana ekranı</title>
  <desc id="d">Solda piksel ofis ve sol üst köşesinde yerel motor kutusu; ortada Komuta Merkezi: Sohbet, Terminal, İzleme, Bana sor sabit sekmeleri ve Diğer menüsü, altta mesaj kutusu; sağda alt alta ajan kartları.</desc>
  <style>
    text { font-family: "Atkinson Hyperlegible", "Segoe UI", sans-serif; fill: #1A1320; }
    .k { font-size: 13px; }
    .s { font-size: 11px; }
    .c { font-size: 14px; font-weight: 700; fill: #fff; }
  </style>
  <rect width="1000" height="560" fill="#DDE6E2"/>
  <!-- başlık çubuğu -->
  <rect x="10" y="10" width="980" height="34" fill="#fff" stroke="#B8B0A0"/>
  <text x="24" y="32" class="k" style="font-weight:700">Emret Agency</text>
  <text x="96" y="32" class="s" style="fill:#6B6372">v0.0.5</text>
  <rect x="150" y="18" width="120" height="18" rx="9" fill="#2F9E6A"/><text x="162" y="31" class="s" style="fill:#fff;font-weight:700">Tüm işçiler yerelde</text>

  <!-- ofis -->
  <rect x="10" y="54" width="430" height="496" fill="#1A1320"/>
  <!-- (img içinde dış dosya yüklenmez: ofis burada basit çizim) -->
  <rect x="20" y="180" width="410" height="300" fill="#7FA898"/>
  <g fill="#C79B5E"><rect x="50" y="230" width="60" height="22"/><rect x="190" y="230" width="60" height="22"/><rect x="330" y="230" width="60" height="22"/><rect x="50" y="330" width="60" height="22"/><rect x="190" y="330" width="60" height="22"/><rect x="330" y="330" width="60" height="22"/></g>
  <g fill="#2B2140"><rect x="70" y="212" width="20" height="16"/><rect x="210" y="212" width="20" height="16"/><rect x="350" y="212" width="20" height="16"/><rect x="70" y="312" width="20" height="16"/><rect x="210" y="312" width="20" height="16"/><rect x="350" y="312" width="20" height="16"/></g>
  <g><rect x="74" y="258" width="12" height="18" fill="#2F9E6A"/><rect x="214" y="258" width="12" height="18" fill="#2F9E6A"/><rect x="354" y="258" width="12" height="18" fill="#3A6FD8"/><rect x="74" y="358" width="12" height="18" fill="#C9B458"/><rect x="214" y="358" width="12" height="18" fill="#2F9E6A"/></g>
  <text x="30" y="470" class="s" style="fill:#fff">piksel ofis: ajanlar masalarında</text>
  <!-- yerel motor kutusu -->
  <rect x="20" y="64" width="190" height="104" rx="6" fill="#1A1320" fill-opacity="0.9" stroke="#8FE3C0"/>
  <circle cx="32" cy="78" r="4" fill="#2F9E6A"/><text x="42" y="82" class="s" style="fill:#fff;font-weight:700">Yerel motor</text>
  <text x="30" y="100" class="s" style="fill:#fff">Ekran kartı  9,2 / 10 GB</text>
  <rect x="30" y="106" width="170" height="4" fill="#4A4152"/><rect x="30" y="106" width="150" height="4" fill="#2F9E6A"/>
  <text x="30" y="126" class="s" style="fill:#fff">Modelde  Reklam</text>
  <text x="30" y="142" class="s" style="fill:#fff">Sırada  Araştırma, Developer</text>
  <text x="30" y="158" class="s" style="fill:#fff">API'de  Muhasebe (EVREN)</text>

  <!-- komuta merkezi -->
  <rect x="450" y="54" width="380" height="496" fill="#fff" stroke="#B8B0A0"/>
  <text x="462" y="78" class="k" style="font-weight:700">KOMUTA MERKEZİ</text>
  <text x="590" y="78" class="k" style="font-weight:700">Sohbet</text>
  <rect x="588" y="84" width="46" height="3" fill="#7A3E9D"/>
  <text x="644" y="78" class="k">Terminal</text><text x="706" y="78" class="k">İzleme</text><text x="756" y="78" class="k">Bana sor</text>
  <circle cx="816" cy="72" r="5" fill="#E5484D"/>
  <text x="462" y="104" class="k">☰ Diğer ▾</text>
  <rect x="462" y="116" width="356" height="56" rx="6" fill="#F3F7F5"/><text x="474" y="140" class="s">Genel Müdür: Görev dağıtıldı — Reklam lansman</text><text x="474" y="158" class="s">metnini, Developer giriş sayfasını yapıyor.</text>
  <rect x="462" y="182" width="356" height="56" rx="6" fill="#F3F7F5"/><text x="474" y="206" class="s">Developer: Testler yeşil, inceleme masasına</text><text x="474" y="224" class="s">gönderdim.</text>
  <!-- mesaj kutusu -->
  <rect x="450" y="420" width="380" height="130" fill="#EFE6F7"/>
  <rect x="450" y="420" width="380" height="4" fill="#7A3E9D"/>
  <text x="462" y="444" class="k" style="font-weight:700">✉ Genel Müdür için mesaj</text>
  <rect x="462" y="452" width="356" height="64" fill="#fff" stroke="#B8B0A0"/>
  <text x="472" y="474" class="s" style="fill:#8A8291">Mesaj yaz, dosya sürükle…</text>
  <rect x="760" y="524" width="58" height="20" rx="3" fill="#1A1320"/><text x="772" y="538" class="s" style="fill:#fff">gönder</text>

  <!-- ajan kartları -->
  <rect x="840" y="54" width="150" height="496" fill="#EFEBE2" stroke="#B8B0A0"/>
  <g class="s">
    <rect x="848" y="62" width="134" height="52" fill="#fff" stroke="#7A3E9D" stroke-width="2"/><text x="856" y="80" class="s" style="font-weight:700">Genel Müdür</text><text x="856" y="98" class="s">Claude · çalışıyor</text>
    <rect x="848" y="122" width="134" height="52" fill="#fff" stroke="#B8B0A0"/><text x="856" y="140" class="s" style="font-weight:700">Reklam</text><rect x="856" y="148" width="34" height="14" rx="7" fill="#2F9E6A"/><text x="862" y="159" class="s" style="fill:#fff">Yerel</text>
    <rect x="848" y="182" width="134" height="52" fill="#fff" stroke="#B8B0A0"/><text x="856" y="200" class="s" style="font-weight:700">Developer</text><rect x="856" y="208" width="34" height="14" rx="7" fill="#2F9E6A"/><text x="862" y="219" class="s" style="fill:#fff">Yerel</text>
    <rect x="848" y="242" width="134" height="52" fill="#fff" stroke="#B8B0A0"/><text x="856" y="260" class="s" style="font-weight:700">Muhasebe</text><rect x="856" y="268" width="30" height="14" rx="7" fill="#E5484D"/><text x="862" y="279" class="s" style="fill:#fff">API</text>
    <rect x="848" y="302" width="134" height="52" fill="#fff" stroke="#B8B0A0"/><text x="856" y="320" class="s" style="font-weight:700">Araştırma</text><rect x="856" y="328" width="34" height="14" rx="7" fill="#2F9E6A"/><text x="862" y="339" class="s" style="fill:#fff">Yerel</text>
  </g>

  <!-- etiketler -->
  <g>
    <circle cx="218" cy="70" r="12" fill="#E5484D"/><text x="214" y="75" class="c">1</text>
    <circle cx="430" cy="300" r="12" fill="#E5484D"/><text x="426" y="305" class="c">2</text>
    <circle cx="840" cy="96" r="12" fill="#E5484D"/><text x="836" y="101" class="c">3</text>
    <circle cx="838" cy="432" r="12" fill="#E5484D"/><text x="834" y="437" class="c">4</text>
    <circle cx="990" cy="160" r="12" fill="#E5484D"/><text x="986" y="165" class="c">5</text>
  </g>
</svg>
